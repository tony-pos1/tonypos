<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  <!-- Golden circular emblem accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#f59e0b" stroke-width="8" stroke-dasharray="16 12" opacity="0.6"/>
  
  <!-- Thai bowl -->
  <path d="M120 250 C120 370, 392 370, 392 250 Z" fill="#f59e0b" />
  <ellipse cx="256" cy="250" rx="136" ry="32" fill="#fbbf24" />
  <ellipse cx="256" cy="250" rx="124" ry="24" fill="#d97706" />
  
  <!-- Bowl Base -->
  <path d="M216 358 L296 358 L288 382 L224 382 Z" fill="#b45309" />

  <!-- Steam curves -->
  <path d="M200 200 Q215 160 195 130 Q210 100 190 70" fill="none" stroke="#fef3c7" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
  <path d="M256 190 Q275 150 250 120 Q270 85 250 50" fill="none" stroke="#fef3c7" stroke-width="14" stroke-linecap="round" opacity="0.95"/>
  <path d="M312 200 Q325 165 305 135 Q325 105 310 75" fill="none" stroke="#fef3c7" stroke-width="12" stroke-linecap="round" opacity="0.85"/>

  <!-- Chopsticks -->
  <line x1="160" y1="90" x2="350" y2="280" stroke="#f1f5f9" stroke-width="10" stroke-linecap="round" />
  <line x1="180" y1="80" x2="370" y2="270" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round" />
  
  <!-- Small Thai decorative star -->
  <circle cx="256" cy="420" r="10" fill="#f59e0b" />
  <circle cx="220" cy="420" r="5" fill="#f59e0b" opacity="0.7"/>
  <circle cx="292" cy="420" r="5" fill="#f59e0b" opacity="0.7"/>
</svg>
